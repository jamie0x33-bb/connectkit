[project]
name = "skills"
version = "1.2.0"
description = "Build, validate and debug Perplexity Computer skills, with connector discovery and schema caching"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
skills = "skills.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
