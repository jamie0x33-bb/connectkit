[project]
name = "connectkit"
version = "1.2.0"
description = "Connector toolkit for Perplexity Computer: discovery, schema caching, retries and skill scaffolding"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
connectkit = "connectkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
